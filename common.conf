#!/bin/bash

### Image config

# Addresses
GATEWAY="192.168.1.1"

# WAN Config
WAN_VLAN="35" # Set to "false" to disable VLAN tagging
SQM_INTERFACE="wan.35" # Use "pppoe-wan" if your ISP uses PPPoE, or physical device (e.g., eth1) for strict hardware binding

# SQM
ENABLE_SQM="true"
DOWNLOAD_SPEED="945000"
UPLOAD_SPEED="108000"

# SQM Overhead
LINKLAYER="ethernet"
OVERHEAD="42" # 38 (Standard Ethernet) + 4 (VLAN 35 tag)

# SQM Algorithms
SQM_QDISC="cake"
SQM_SCRIPT="piece_of_cake.qos"

# Set only the first one to "true" for software offloading
# Recommended for increased throughput, hardware offlloading is incompatible with QoS/SQM
FLOW_OFFLOADING="true"
FLOW_OFFLOADING_HW="false"

# Packet steering configuration
# "disabled" / "enabled" / "enabled_all" (enabled for all CPUs)
PACKET_STEERING="enabled_all"
# "disabled" / "128" / "256" / etc.
STEERING_FLOWS="256"
# CPU affinity mask (hex). E.g. 'e' (1110) leaves CPU0 for hardware interrupts
# Disable with "disabled"
STEERING_AFFINITY="e"

# WiFi - common config
SSID="Fiber"
MOBILITY_DOMAIN="abba"
COUNTRY="PL"
FT_OVER_DS="false"

# WiFi - 2GHz Main
ENABLE_2G="true"

# WiFi - 5GHz Main
ENABLE_5G="true"

# WiFi - 2GHz Alt
ENABLE_2G_ALT="false"
SSID_2G_ALT="${SSID}2G"
MOBILITY_DOMAIN_2G_ALT="abb2"

# WiFi - 5GHz Alt
ENABLE_5G_ALT="true"
SSID_5G_ALT="${SSID}5G"
MOBILITY_DOMAIN_5G_ALT="abb5"

# Time zone
ZONENAME="Europe/Warsaw"
TIMEZONE="CET-1CEST,M3.5.0,M10.5.0/3"

# DNS
DNS_1="1.1.1.1"
DNS_2="1.0.0.1"
DNS6_1="2606:4700:4700::1111"
DNS6_2="2606:4700:4700::1001"

# IPv6 Setup
ENABLE_IPV6="false"

# Packages
PACKAGES="luci-ssl-openssl luci-app-sqm wpad-openssl speedtest-go iperf3 irqbalance kmod-tcp-bbr htop"
WPAD_REMOVED="-wpad -wpad-basic -wpad-basic-mbedtls -wpad-basic-openssl -wpad-basic-wolfssl -wpad-mesh-mbedtls -wpad-mesh-openssl -wpad-mesh-wolfssl -wpad-mini"
REMOVED_PACKAGES="$WPAD_REMOVED"

###
